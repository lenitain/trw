[package]
name = "trw"
version = "0.0.3"
edition = "2024"
license = "MIT"
description = "3D Trapping Rain Water visualization demo"
repository = "https://github.com/lenitain/trw"
readme = "README.md"
keywords = ["3d", "visualization", "simulation", "tui", "trapping-rain-water"]
categories = ["visualization", "command-line-utilities"]
authors = ["lenitain <xt.zhu@qq.com>"]
rust-version = "1.97"
documentation = "https://docs.rs/trw"

include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "src/",
    "CHANGELOG.md",
    "tests/",
]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.1"
ratatui-wireframe = "0.7.0"
rayon = "1.12"
rand = "0.10"

[dev-dependencies]
libc = "0.2"
